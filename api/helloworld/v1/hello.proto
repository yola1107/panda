syntax = "proto3";

package helloworld.v1;

import "google/api/annotations.proto";

option go_package = "github.com/yola1107/panda/api/helloworld/v1;v1";

// GreeterService 提供用于接入 HTTP 和 gRPC 的最小问候接口。
service GreeterService {
  // SayHello 根据请求中的姓名返回问候消息。
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse) {
    option (google.api.http) = {get: "/v1/hello/{name}"};
  }
}

// SayHelloRequest 指定问候对象。
message SayHelloRequest {
  string name = 1;
}

// SayHelloResponse 返回生成的问候消息。
message SayHelloResponse {
  string message = 1;
}
